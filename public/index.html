<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthBot - Disease Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="avatar">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=healthbot" alt="Bot Avatar">
            </div>
            <div class="header-info">
                <h1>HealthBot</h1>
                <p>AI Disease Symptom Predictor</p>
            </div>
        </header>

        <main class="chat-body" id="chat-body">
            <div class="message bot">
                <div class="message-content">
                    Hi! I'm HealthBot. I can help predict possible diseases based on your symptoms. Please tell me what symptoms you are experiencing.
                </div>
            </div>
        </main>

        <div class="symptom-tags" id="symptom-tags">
            <!-- Dynamically added symptoms will go here -->
        </div>

        <footer class="chat-footer">
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Type your symptoms here (e.g. skin rash, headache)..." autocomplete="off" required>
                <button type="submit">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
            <button id="predict-btn" class="predict-btn">Predict Disease</button>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
